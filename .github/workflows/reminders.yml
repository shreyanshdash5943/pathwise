# Sends due reminders every hour. Free on GitHub Actions.
# Set two repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL      your deployed URL, e.g. https://pathwise.example.com
#   CRON_SECRET  the same value as CRON_SECRET in the app's environment
# GitHub may start scheduled runs a few minutes late; reminders that are due are
# simply picked up by the next run, never sent twice.
name: Send reminders

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminders job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET isn't set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST "$APP_URL/api/cron/reminders" \
            -H "Authorization: Bearer $CRON_SECRET"
